site_name: Migibio Research Center
site_description: >-
  Scientific evidence hub for Migibio veterinary POCT diagnostics — methodology, analytical validation, comparative studies, and white papers on fluorescence immunochromatography (FICT).
site_url: https://research.migibio.net/
site_author: Guangzhou Magic Biotech Co., Ltd.
copyright: © 2026 Guangzhou Magic Biotech Co., Ltd. (Migibio)

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/microscope
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - "About & Editorial":
      - about/index.md
      - editorial-policy/index.md
  - "Methodology":
      - methodology/index.md
      - "Study Design": methodology/study-design.md
      - "Statistical Methods": methodology/statistical-methods.md
  - "FICT Technology":
      - fict-technology/index.md
      - "FICT Technical White Paper": fict-technology/fluorescence-immunochromatography.md
      - "Fluorophores & Labeling": fict-technology/fluorophores-and-labeling.md
  - "Analytical Performance":
      - analytical-performance/index.md
      - "Validation Methodology": analytical-performance/validation-methodology.md
      - "Interference Studies": analytical-performance/interference-studies.md
      - "Precision vs Accuracy": analytical-performance/precision-accuracy-explained.md
  - "Manufacturing Science":
      - manufacturing-science/index.md
      - "Conjugation Chemistry": manufacturing-science/conjugation-chemistry.md
      - "Membrane Coating & Reproducibility": manufacturing-science/membrane-coating-reproducibility.md
  - "Biomarkers":
      - biomarkers/index.md
      - "Biomarker Validation Overview": biomarkers/validation-overview.md
      - "Acute-Phase Proteins (CRP/SAA)": biomarkers/acute-phase-protein-evidence.md
      - "SDMA Clinical Evidence": biomarkers/sdma-clinical-evidence.md
  - "Infectious Disease Research":
      - infectious-disease/index.md
      - "Diagnostic Accuracy (CPV/CDV/FPV)": infectious-disease/diagnostic-accuracy.md
      - "FeLV & FIV Testing Strategy": infectious-disease/felv-fiv-testing-strategy.md
  - "Endocrine Research":
      - endocrine/index.md
      - "Endocrine Assay Validation": endocrine/assay-validation.md
      - "Progesterone Timing Evidence": endocrine/progesterone-timing-evidence.md
      - "Cortisol Dynamic Testing": endocrine/cortisol-dynamic-testing.md
  - "Comparative Studies":
      - comparative-studies/index.md
      - "FICT vs ELISA vs PCR": comparative-studies/fict-vs-elisa-vs-pcr.md
      - "FICT vs Colloidal Gold": comparative-studies/fict-vs-colloidal-gold.md
  - "White Papers":
      - white-papers/index.md
      - "Veterinary POCT: FICT Advantage": white-papers/fict-advantage.md
      - "Economics of In-Clinic Testing": white-papers/economics-of-in-clinic-testing.md
  - "Technical Reports":
      - technical-reports/index.md
      - "Lot-to-Lot Consistency": technical-reports/lot-consistency-report.md
      - "Field Evaluation": technical-reports/field-evaluation-report.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - footnotes
  - def_list
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
